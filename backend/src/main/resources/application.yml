spring:
  application:
    name: kernel-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kernel}
    username: ${DB_USER:kernel}
    password: ${DB_PASSWORD:kernel}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it matches
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

kernel:
  automation:
    enabled: false        # turn on once a real PlanExecutor exists
    cron: "0 0 * * * *"   # every hour on the hour
